name: Build Nexora Windows Installer

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    installer:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build installer
              run: pnpm buildInstaller

            - name: Upload NexoraInstaller.exe
              uses: actions/upload-artifact@v4
              with:
                  name: NexoraInstaller
                  path: dist/installer/NexoraInstaller.exe
                  if-no-files-found: error
                  retention-days: 30
